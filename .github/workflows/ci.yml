name: CI

on:
  push:
    branches: [main, rediseno]
  pull_request:

jobs:
  site:
    name: Build + E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  nginx:
    name: Docker + nginx (headers, redirecciones, /api/lead)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen (igual que Dokploy)
        run: docker build -t invictus .

      - name: Webhook simulado (responde 200 a POST)
        run: |
          docker network create ci
          docker run -d --name mock --network ci python:3-alpine python -c "
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0)); self.rfile.read(n)
                  self.send_response(200); self.send_header('Content-Type', 'application/json'); self.end_headers(); self.wfile.write(b'{\"ok\":true}')
          HTTPServer(('0.0.0.0', 8080), H).serve_forever()"

      - name: Levantar el sitio (con webhook y sin webhook configurado)
        run: |
          docker run -d --name web --network ci -p 8080:80 -e LEAD_WEBHOOK_URL=http://mock:8080/hook invictus
          docker run -d --name web-unset --network ci -p 8081:80 invictus
          sleep 3
          docker exec web nginx -t
          docker logs web 2>&1 | tail -5

      - name: Verificaciones con curl
        run: |
          set -u
          fail=0
          check() { # descripción, esperado, obtenido
            if [ "$2" = "$3" ]; then echo "OK   $1 → $3"; else echo "FAIL $1 → esperado [$2], obtenido [$3]"; fail=1; fi
          }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          loc() { curl -s -o /dev/null -w '%{redirect_url}' "$@"; }
          hdr() { curl -s -D - -o /dev/null "$2" | tr -d '\r' | grep -i "^$1:" | head -1 | cut -d' ' -f2-; }
          B=http://localhost:8080

          check "home 200" 200 "$(code $B/)"
          check "landing condominios 200" 200 "$(code $B/seguridad-para-condominios/)"
          check "guía 200" 200 "$(code $B/guia/cuantos-guardias-necesito/)"
          check "404 real" 404 "$(code $B/no-existe/)"
          check "dotfile .git bloqueado" 404 "$(code $B/.git/config)"
          check "dotfile .env bloqueado" 404 "$(code $B/.env)"
          check "repo no publicado (Dockerfile)" 404 "$(code $B/Dockerfile)"

          check "sin barra → 301 conserva gclid" "/seguridad-para-condominios/?gclid=X" "$(curl -s -o /dev/null -D - "$B/seguridad-para-condominios?gclid=X" | tr -d '\r' | grep -i '^location:' | cut -d' ' -f2)"
          check "legacy /servicios conserva gclid" "/?gclid=ABC" "$(curl -s -o /dev/null -D - "$B/servicios/?gclid=ABC" | tr -d '\r' | grep -i '^location:' | cut -d' ' -f2)"
          check "legacy /contacto → /cotizar/" "/cotizar/" "$(curl -s -o /dev/null -D - "$B/contacto" | tr -d '\r' | grep -i '^location:' | cut -d' ' -f2)"
          check "legacy servicio eventos" "/guardias-para-eventos/" "$(curl -s -o /dev/null -D - "$B/service/seguridad-para-eventos" | tr -d '\r' | grep -i '^location:' | cut -d' ' -f2)"
          check "legacy landing vieja" "/" "$(curl -s -o /dev/null -D - "$B/invictus-landing.html" | tr -d '\r' | grep -i '^location:' | cut -d' ' -f2)"
          check "wp-admin 410" 410 "$(code $B/wp-admin/)"
          check "sitemap.xml → índice" "/sitemap-index.xml" "$(curl -s -o /dev/null -D - "$B/sitemap.xml" | tr -d '\r' | grep -i '^location:' | cut -d' ' -f2)"
          check "host www → apex" "https://invictussecurity.cl/?a=1" "$(curl -s -o /dev/null -D - -H 'Host: www.invictussecurity.cl' "$B/?a=1" | tr -d '\r' | grep -i '^location:' | cut -d' ' -f2)"

          check "HTML Cache-Control" "public, max-age=0, must-revalidate" "$(hdr Cache-Control $B/)"
          check "HSTS en HTML" "max-age=31536000; includeSubDomains" "$(hdr Strict-Transport-Security $B/)"
          JS=$(curl -s $B/ | grep -o '/_astro/[^"]*\.js' | head -1)
          check "assets con hash: immutable" "public, max-age=31536000, immutable" "$(hdr Cache-Control $B$JS)"
          check "HSTS también en assets" "max-age=31536000; includeSubDomains" "$(hdr Strict-Transport-Security $B$JS)"
          check "noindex en /gracias/" "noindex" "$(hdr X-Robots-Tag $B/gracias/)"
          check "sin noindex en home" "" "$(hdr X-Robots-Tag $B/)"
          check "gzip_static" "gzip" "$(curl -s -D - -o /dev/null -H 'Accept-Encoding: gzip' $B/ | tr -d '\r' | grep -i '^content-encoding:' | cut -d' ' -f2)"

          check "/api/lead GET → 405" 405 "$(code $B/api/lead)"
          check "/api/lead sin Origin → 403" 403 "$(code -X POST -H 'Content-Type: application/json' -d '{}' $B/api/lead)"
          check "/api/lead POST → 200 (proxy al webhook)" 200 "$(code -X POST -H 'Origin: https://invictussecurity.cl' -H 'Content-Type: application/json' -d '{"nombre":"ci"}' $B/api/lead)"
          check "/api/lead sin webhook configurado → 502" 502 "$(code -X POST -H 'Origin: https://invictussecurity.cl' -H 'Content-Type: application/json' -d '{}' http://localhost:8081/api/lead)"
          last=0
          for i in 1 2 3 4 5 6 7 8; do last=$(code -X POST -H 'Origin: https://invictussecurity.cl' -H 'Content-Type: application/json' -d '{}' $B/api/lead); done
          check "/api/lead rate limit → 429" 429 "$last"

          exit $fail

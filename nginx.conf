# Canonical host: todo el tráfico de www. y del subdominio viejo (seguridad.) va con 301 al dominio principal.
# Traefik (Dokploy) termina TLS y pasa el Host original, por eso el match por server_name funciona.
server {
    listen 80;
    server_name www.invictussecurity.cl seguridad.invictussecurity.cl;
    return 301 https://invictussecurity.cl$request_uri;
}

server {
    listen 80 default_server;
    server_name invictussecurity.cl _;
    root /usr/share/nginx/html;
    index invictus-landing.html;

    # Nunca servir archivos ocultos (.git, .env, …). El Dockerfile ya no los copia;
    # esto es defensa en profundidad. Va antes que las demás regex para tener prioridad.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Security headers (apply globally)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Root: serve landing as index
    location = / {
        try_files /invictus-landing.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Pretty URL for the post-conversion thank-you page (form redirects to /gracias).
    # Without this, /gracias 404s and the Google Ads conversion in gracias.html never fires.
    location = /gracias {
        try_files /gracias.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Página para postulantes (gente que busca trabajo como guardia): los saca del formulario de ventas.
    # Excluir esta URL de AI Max / PMax en Google Ads (nunca debe recibir tráfico pagado).
    location = /trabaja-con-nosotros {
        try_files /trabaja-con-nosotros.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Rutas del WordPress anterior (sitio corporativo del cliente, indexadas / usadas en extensiones de Ads).
    # Ya no existen como páginas: 301 permanente a la home o a la sección equivalente.
    # $is_args$args conserva el query string: sin él, el gclid de los sitelinks antiguos se perdía.
    location ~ ^/(servicios|service|services|soluciones)(/.*)?$ { return 301 https://invictussecurity.cl/$is_args$args#servicios; }
    location ~ ^/(contacto|contact|cotizar|cotizacion|presupuesto)/?$ { return 301 https://invictussecurity.cl/$is_args$args#cotizar; }
    location ~ ^/(nosotros|sobre-nosotros|quienes-somos|empresa|about|blog|noticias|home|index\.php)(/.*)?$ { return 301 https://invictussecurity.cl/$is_args$args; }
    # Alias para postulantes (la location exacta /trabaja-con-nosotros gana antes que esta regex: no hay loop).
    location ~ ^/(trabaja-con-nosotros|trabaja|trabajo|empleo|empleos|postula|postulaciones)/?$ { return 301 https://invictussecurity.cl/trabaja-con-nosotros$is_args$args; }
    location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|xmlrpc\.php|feed)(/.*)?$ { return 410; }

    # Serve robots.txt and other real files; do NOT fall back to landing for unknown paths
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Cache static assets. 7 días y SIN immutable: los nombres no llevan hash, así que un
    # reemplazo de imagen debe poder verse. (`expires` + add_header duplicaba Cache-Control.)
    # add_header en una location anula los del server: repetir aquí los de seguridad.
    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|svg|css|js|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css text/plain text/xml application/javascript application/xml image/svg+xml;
    gzip_min_length 256;
}

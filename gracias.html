<!DOCTYPE html>
<html lang="es-CL">
<head>
  <!-- Solo medimos si venimos de un envío real del formulario: la landing deja un token
       en sessionStorage justo antes de redirigir. Se consume al leerlo, así que una
       recarga, una visita directa o un bot NO disparan GTM ni la conversión de Ads. -->
  <script>
    (function () {
      var lead = null, counted = false;
      try {
        lead = JSON.parse(sessionStorage.getItem('inv_lead') || 'null');
        sessionStorage.removeItem('inv_lead');
        counted = sessionStorage.getItem('inv_counted') === '1';
      } catch (e) {}
      var fresh = !!(lead && lead.id && lead.ts && (Date.now() - lead.ts) < 30 * 60 * 1000);
      // Respaldo: llegada desde la propia landing sin token (p. ej. si el embed de hapee
      // redirigió por su cuenta). Cuenta una sola vez por sesión: una recarga conserva el
      // referrer, pero ya queda marcada como contada. Visitas directas/bots no traen referrer.
      if (!fresh && !counted) {
        var ref = document.referrer || '';
        if (ref.indexOf(location.origin + '/') === 0 && ref.indexOf('/gracias') === -1) {
          lead = { id: 'ref-' + Date.now() + '-' + Math.random().toString(36).slice(2), ts: Date.now() };
          fresh = true;
        }
      }
      if (fresh) { try { sessionStorage.setItem('inv_counted', '1'); } catch (e) {} }
      window.__invLead = fresh ? lead : null;
    })();
  </script>

  <!-- Google Tag Manager (condicionado al token) -->
  <script>if (window.__invLead) { (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-WNTMK96Q'); }</script>
  <!-- End Google Tag Manager -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>¡Gracias! - Invictus Security</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Google tag (gtag.js) + conversión PRIMARIA de Ads (OcKZ…), condicionados al token.
       transaction_id = id del lead: Ads deduplica si por cualquier motivo llegara dos veces.
       (La acción 3VxW… que dispara GTM es secundaria: no afecta las pujas.) -->
  <script>
    if (window.__invLead) {
      var gs = document.createElement('script');
      gs.async = true;
      gs.src = 'https://www.googletagmanager.com/gtag/js?id=G-VWCD5DSP40';
      document.head.appendChild(gs);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-VWCD5DSP40');
      gtag('config', 'AW-17648531850');
      gtag('event', 'conversion', {
        'send_to': 'AW-17648531850/OcKZCPrpu50cEIrzvN9B',
        'transaction_id': window.__invLead.id
      });
    }
  </script>

  <style>

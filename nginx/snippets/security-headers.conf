# Cabeceras de seguridad. Se incluyen SOLO a nivel server: ninguna location usa add_header,
# así no se pierden por la herencia de add_header de nginx.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# CSP mínima en modo enforce (no rompe GTM ni etiquetas de Google).
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

# CSP completa en Report-Only para observar antes de endurecer (Google exige listar cada
# dominio de país por separado, p. ej. www.google.cl). Sin COOP: rompe la vista previa de Tag Assistant.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://www.google.com https://www.google.cl https://beta.hapee.ai; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://www.google.cl https://pagead2.googlesyndication.com https://www.googleadservices.com; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://www.google.cl https://googleads.g.doubleclick.net; frame-src https://*.googletagmanager.com https://td.doubleclick.net https://beta.hapee.ai; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
